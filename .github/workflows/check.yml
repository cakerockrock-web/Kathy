name: Check Cafe Notice

on:
  schedule:
    - cron: '*/5 * * * *'  # รันอัตโนมัติทุก 5 นาที
  workflow_dispatch:        # กดปุ่มรันมือได้

jobs:
  check-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_CHANNEL_ID_COUPON: ${{ secrets.DISCORD_CHANNEL_ID_COUPON }}
        run: |
          python main.py

      - name: Commit Last IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_ids.json
          git commit -m "Update Naver IDs [skip ci]" || exit 0
          git push
