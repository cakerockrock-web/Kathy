name: Webtoon Notifier

on:
  workflow_dispatch:

jobs:
  check-webtoon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Webtoon Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID_WEBTOON: ${{ secrets.DISCORD_CHANNEL_ID_WEBTOON }}
        run: python webtoon.py

      - name: Commit Webtoon IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_webtoon_ids.json
          git commit -m "Update Webtoon IDs [skip ci]" || exit 0
          git pull --rebase origin main || exit 0
          git push
