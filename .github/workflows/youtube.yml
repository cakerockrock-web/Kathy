name: YouTube Notifier

on:
  schedule:
    - cron: '*/5 * * * *'  # ทำงานทุก 5 นาที
  workflow_dispatch:        # กดปุ่มรันด้วยมือได้
  push:
    paths:
      - 'youtube_bot.py'
      - 'last_youtube_videos.json'
      - '.github/workflows/youtube.yml'

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run YouTube Bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python youtube_bot.py

      - name: Commit YouTube IDs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_youtube_videos.json
          git commit -m "Update YouTube IDs [skip ci]" || exit 0
          git push
